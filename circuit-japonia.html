<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Circuit Japonia · Tokyo, Fuji, Osaka, Kyoto, Nara, Hiroshima</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --indigo:       #1F3452;
    --indigo-dark:  #0F1F33;
    --indigo-light: #33587F;
    --vermillion:   #C1392B;
    --gold:         #C9A227;
    --sky:          #4A7FA6;
    --sand:         #F7F3ED;
    --panel:        #ECE4D6;
    --ink:          #211B1D;
    --ink-soft:     #5C5359;
    --line:         rgba(33,27,29,0.10);
    --warn-bg:      #F1E9DA;
    --warn-edge:    #B8863B;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;
    font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--sand);}

  #app{position:relative;width:100vw;height:100vh;}
  #map{position:absolute;inset:0;background:#E9E4D8;}
  .leaflet-control-attribution{font-size:10px;opacity:.6;background:rgba(255,255,255,.75)!important;}
  .leaflet-control-zoom{border:none!important;margin:0 16px 18px 0!important;}
  .leaflet-control-zoom a{
    border-radius:10px!important;color:var(--indigo-dark)!important;
    box-shadow:0 2px 10px rgba(15,31,51,.15)!important;border:1px solid var(--line)!important;
  }

  /* ---------- Reserve button ---------- */
  #reserveBtn{
    position:absolute;top:20px;left:20px;z-index:500;
    display:inline-flex;align-items:center;gap:8px;
    background:var(--vermillion);color:#fff;border:none;border-radius:999px;
    padding:13px 22px 13px 18px;font:600 14.5px 'Inter',sans-serif;letter-spacing:.2px;
    cursor:pointer;box-shadow:0 6px 18px rgba(193,57,43,.32);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  #reserveBtn:hover{background:#D8493A;transform:translateY(-1px);box-shadow:0 8px 22px rgba(193,57,43,.4);}
  #reserveBtn svg{width:16px;height:16px;flex:none;}

  /* ---------- Map pill markers ---------- */
  .pill{display:inline-flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%);}
  .pill-label{
    background:var(--indigo);color:#fff;font:700 12.5px 'Inter',sans-serif;letter-spacing:.2px;
    padding:6px 12px;border-radius:8px;white-space:nowrap;box-shadow:0 4px 12px rgba(15,31,51,.32);
    border:1.5px solid rgba(255,255,255,.5);
    transition:transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease;
  }
  .pill.waypoint .pill-label{background:var(--sky);font-weight:600;padding:5px 10px;font-size:11.5px;}
  .pill-tail{width:9px;height:9px;background:var(--indigo);transform:rotate(45deg) translateY(-6px);
    box-shadow:0 4px 8px rgba(15,31,51,.22);}
  .pill.waypoint .pill-tail{background:var(--sky);}
  .pill.is-active .pill-label{transform:scale(1.12);box-shadow:0 6px 18px rgba(193,57,43,.45);}
  .pill.pulse .pill-label{animation:pulse .8s ease;}
  @keyframes pulse{0%{transform:scale(1);} 40%{transform:scale(1.28);} 100%{transform:scale(1.12);}}

  .mover{display:flex;align-items:center;justify-content:center;width:30px;height:30px;
    border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(33,27,29,.35);
    border:2px solid var(--vermillion);font-size:15px;transform:translate(-50%,-50%);}

  /* ---------- Sidebar ---------- */
  #sidebar{
    position:absolute;top:0;right:0;height:100%;width:410px;max-width:88vw;
    background:var(--sand);z-index:600;display:flex;flex-direction:column;
    box-shadow:-8px 0 30px rgba(33,27,29,.16);
    transition:transform .35s cubic-bezier(.65,0,.35,1);
  }
  #sidebar.hidden{transform:translateX(100%);}

  .sb-header{position:relative;padding:26px 26px 22px;background:linear-gradient(155deg,var(--indigo-dark),var(--indigo) 85%);
    color:#fff;overflow:hidden;flex:none;}
  .sb-header .fuji{position:absolute;left:0;right:0;bottom:0;height:46px;opacity:.25;}
  .sb-close{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;
    background:rgba(255,255,255,.16);border:none;color:#fff;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .15s ease;}
  .sb-close:hover{background:rgba(255,255,255,.3);}
  .eyebrow{font:700 11px 'Inter',sans-serif;letter-spacing:1.3px;text-transform:uppercase;
    color:#B9CBE0;position:relative;z-index:1;}
  .sb-header h1{font:600 22px/1.3 'Fraunces',serif;margin:8px 0 10px;position:relative;z-index:1;}
  .price-line{font:700 13px 'Inter',sans-serif;color:#F0C9A0;position:relative;z-index:1;margin-bottom:8px;}
  .route-breadcrumb{font:500 11.5px 'Inter',sans-serif;color:#DCE6F0;line-height:1.6;position:relative;z-index:1;}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;position:relative;z-index:1;}
  .legend span{display:flex;align-items:center;gap:6px;font:500 11.5px 'Inter',sans-serif;color:#EAEFF5;}
  .legend i{width:16px;height:0;display:inline-block;}
  .l-flight i{border-top:2.5px dashed #9FC3DD;}
  .l-train i{border-top:3px dashed #E68A7C;}
  .l-tour i{border-top:2px dashed #E6CC7C;}

  .steps{flex:1;overflow-y:auto;padding:6px 0 26px;}
  .steps::-webkit-scrollbar{width:6px;}
  .steps::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}

  .step{display:flex;gap:14px;padding:16px 26px;cursor:pointer;border-left:3px solid transparent;
    transition:background .18s ease, border-color .18s ease;}
  .step:hover{background:var(--panel);}
  .step.active{background:#E4E9F0;border-left-color:var(--vermillion);}
  .step-num{flex:none;width:27px;height:27px;border-radius:50%;background:var(--indigo);color:#fff;
    display:flex;align-items:center;justify-content:center;font:700 12.5px 'Inter',sans-serif;margin-top:2px;}
  .step-body h3{margin:0 0 2px;font:600 14.5px 'Fraunces',serif;color:var(--ink);}
  .step-cat{display:block;font:600 10.5px 'Inter',sans-serif;letter-spacing:.3px;text-transform:uppercase;
    color:var(--vermillion);opacity:.95;margin-bottom:6px;}
  .step-body p{margin:0;font:400 13px/1.6 'Inter',sans-serif;color:var(--ink-soft);}

  .notice{margin:6px 26px 0;padding:14px 16px;background:var(--warn-bg);border-left:3px solid var(--warn-edge);
    border-radius:0 10px 10px 0;}
  .notice h4{margin:0 0 8px;font:700 11.5px 'Inter',sans-serif;letter-spacing:.3px;text-transform:uppercase;
    color:#8A5A25;display:flex;align-items:center;gap:6px;}
  .notice ul{margin:0;padding-left:18px;}
  .notice li{font:400 12.5px/1.55 'Inter',sans-serif;color:#5E4530;margin-bottom:6px;}
  .notice li:last-child{margin-bottom:0;}

  #reopenTab{
    position:absolute;top:24px;right:0;z-index:601;background:var(--vermillion);color:#fff;border:none;
    padding:12px 14px;border-radius:10px 0 0 10px;font:600 12.5px 'Inter',sans-serif;cursor:pointer;
    box-shadow:-4px 4px 14px rgba(193,57,43,.28);display:none;align-items:center;gap:6px;
  }
  #reopenTab.show{display:flex;}

  @media (max-width:760px){
    #sidebar{top:auto;bottom:0;left:0;right:0;width:100%;max-width:100%;height:60vh;
      border-radius:18px 18px 0 0;transition:transform .35s cubic-bezier(.65,0,.35,1);}
    #sidebar.hidden{transform:translateY(100%);}
    #reopenTab{top:auto;bottom:20px;right:16px;border-radius:999px;box-shadow:0 6px 18px rgba(193,57,43,.32);}
    #reserveBtn{padding:11px 18px 11px 15px;font-size:13.5px;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>


  <aside id="sidebar">
    <div class="sb-header">
      <svg class="fuji" viewBox="0 0 400 46" preserveAspectRatio="none">
        <path d="M120 46 L195 4 L270 46 Z" fill="#fff"/>
        <path d="M182 22 L195 4 L208 22 Z" fill="var(--indigo-dark)" opacity=".5"/>
      </svg>
      <button class="sb-close" id="sbClose" aria-label="Închide">✕</button>
      <div class="eyebrow">13–27 Noiembrie 2026 · Cazare 14–26 Nov</div>
      <h1>Circuit Japonia: Tokyo · Fuji · Osaka · Kyoto · Nara · Hiroshima ⛩️</h1>
      <div class="price-line">De la 3.750 € / persoană · Cameră single: +750 €</div>
      <div class="route-breadcrumb">Chișinău → Tokyo → Fuji → Osaka → Kyoto → Nara → Hiroshima → Tokyo → Chișinău</div>
      <div class="legend">
        <span class="l-flight"><i></i>Zbor</span>
        <span class="l-train"><i></i>Tren între orașe</span>
        <span class="l-tour"><i></i>Excursie de o zi</span>
      </div>
    </div>

    <div class="steps" id="stepsList"></div>
  </aside>

  <button id="reopenTab">☰ Program</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // ---------- Data ----------
  const PLACES = {
    chi:      { name:'Chișinău',   lat:47.0105, lng:28.8638,  waypoint:true,  zoom:4  },
    tokyo:    { name:'Tokyo',      lat:35.6762, lng:139.6503, waypoint:false, zoom:10 },
    fuji:     { name:'Fuji',       lat:35.5039, lng:138.7622, waypoint:false, zoom:11 },
    osaka:    { name:'Osaka',      lat:34.6937, lng:135.5023, waypoint:false, zoom:10 },
    kyoto:    { name:'Kyoto',      lat:35.0116, lng:135.7681, waypoint:false, zoom:11 },
    nara:     { name:'Nara',       lat:34.6851, lng:135.8048, waypoint:false, zoom:11 },
    hiroshima:{ name:'Hiroshima',  lat:34.3853, lng:132.4553, waypoint:false, zoom:10 },
  };

  // Real relocations between hotel bases (Shinkansen), animated together with the flights
  const JOURNEY = [
    { from:'chi',   to:'tokyo',     mode:'flight' },
    { from:'tokyo', to:'fuji',      mode:'train'  },
    { from:'fuji',  to:'osaka',     mode:'train'  },
    { from:'osaka', to:'tokyo',     mode:'train'  },
    { from:'tokyo', to:'chi',       mode:'flight' },
  ];
  // Day-trip excursions from the Osaka base (static, no overnight)
  const TOUR_LEGS = [
    { from:'osaka', to:'kyoto' }, { from:'osaka', to:'nara' }, { from:'osaka', to:'hiroshima' },
  ];
  const MODE_STYLE = {
    flight: { color:'#4A7FA6', weight:3,   opacity:.80, dash:'1 11' },
    train:  { color:'#C1392B', weight:4.5, opacity:.90, dash:'1 9'  },
  };
  const MODE_EMOJI = { flight:'✈️', train:'🚅' };

  const STEPS = [
    { n:1, cat:'Zbor tur', title:'Chișinău – Tokyo', bounds:['chi','tokyo'],
      text:'Decolare din Chișinău pe 13.11.2026, cu sosire în Tokyo pe 14.11.2026.' },
    { n:2, cat:'Cazare: The B Akasaka Hotel 3★', title:'Tokyo · 14–19 Noiembrie (5 nopți)', focus:'tokyo',
      text:'Două zile complete de excursii în cele mai emblematice locații ale orașului, plus o zi întreagă la Tokyo Disneyland (bilete incluse).' },
    { n:3, cat:'Cazare: MYSTAYS Fuji Onsen Resort 3★', title:'Tokyo – Fuji · 19–20 Noiembrie (1 noapte)', bounds:['tokyo','fuji'],
      text:'Deplasare cu trenul spre zona Muntelui Fuji. Excursie la Pagoda Chureito din Arakurayama Sengen Park, Lacul Kawaguchi și satul tradițional Iyashi no Sato.' },
    { n:4, cat:'Cazare: Garner Hotel Osaka Honmachi Kita Semba 3★', title:'Fuji – Osaka · 20–24 Noiembrie (4 nopți)', bounds:['fuji','osaka'],
      text:'Deplasare cu trenul spre Osaka, care devine baza pentru următoarele trei excursii de o zi.' },
    { n:5, cat:'Excursie de o zi', title:'Excursie Osaka', focus:'osaka',
      text:'Cele mai emblematice locații din Osaka.' },
    { n:6, cat:'Excursie de o zi', title:'Excursie Kyoto &amp; Nara', bounds:['kyoto','nara'],
      text:'Cele mai emblematice locații din Kyoto și Nara, într-o singură zi, cu plecare din Osaka.' },
    { n:7, cat:'Excursie UNESCO', title:'Excursie Hiroshima &amp; Miyajima', focus:'hiroshima',
      text:'Obiectivele UNESCO din Hiroshima și insula Miyajima, cu plecare din Osaka.' },
    { n:8, cat:'Cazare: Hotel Villa Fontaine Tokyo – Hatchobori 3★', title:'Osaka – Tokyo · 24–26 Noiembrie (2 nopți)', bounds:['osaka','tokyo'],
      text:'Revenire cu trenul la Tokyo pentru ultimele două nopți. Opțional, pe 24.11: experiența Fast &amp; Furious Tokyo Drift (+150 €/persoană).' },
    { n:9, cat:'Zbor retur', title:'Tokyo – Chișinău', bounds:['tokyo','chi'],
      text:'Plecare din Tokyo pe 26.11.2026, cu sosire în Chișinău pe 27.11.2026.' },
  ];

  // ---------- Map ----------
  const map = L.map('map', { zoomControl:false, attributionControl:true, worldCopyJump:true });
  L.control.zoom({ position:'bottomright' }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution:'© OpenStreetMap, © CARTO', maxZoom:19, subdomains:'abcd'
  }).addTo(map);

  const jpBounds = L.latLngBounds(['tokyo','fuji','osaka','kyoto','nara','hiroshima'].map(id=>[PLACES[id].lat,PLACES[id].lng]));
  map.fitBounds(jpBounds, { padding:[90,90] });

  function pillIcon(name, waypoint){
    return L.divIcon({
      className:'', html:`<div class="pill${waypoint?' waypoint':''}"><div class="pill-label">${name}</div><div class="pill-tail"></div></div>`,
      iconSize:[0,0], iconAnchor:[0,0]
    });
  }

  const markers = {};
  Object.entries(PLACES).forEach(([id,p])=>{
    const m = L.marker([p.lat,p.lng], { icon:pillIcon(p.name,p.waypoint) }).addTo(map);
    markers[id] = m;
    m.on('click', ()=> focusIds([id]));
  });

  JOURNEY.forEach(seg=>{
    const a = PLACES[seg.from], b = PLACES[seg.to], st = MODE_STYLE[seg.mode];
    L.polyline([[a.lat,a.lng],[b.lat,b.lng]], {
      color:st.color, weight:st.weight, opacity:st.opacity, dashArray:st.dash, lineCap:'round'
    }).addTo(map);
  });
  TOUR_LEGS.forEach(seg=>{
    const a = PLACES[seg.from], b = PLACES[seg.to];
    L.polyline([[a.lat,a.lng],[b.lat,b.lng]], { color:'#C9A227', weight:2.5, opacity:.8, dashArray:'3 8', lineCap:'round' }).addTo(map);
  });

  // ---------- Moving icon along the real journey (flights + inter-city trains) ----------
  function haversine(a,b){
    const R=6371, toRad=d=>d*Math.PI/180;
    const dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
    const s=Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(s));
  }
  const segDist = JOURNEY.map(s=>haversine(PLACES[s.from],PLACES[s.to]));
  const totalDist = segDist.reduce((a,b)=>a+b,0);
  const LOOP_MS = 32000;

  const mover = L.marker([PLACES.chi.lat,PLACES.chi.lng], {
    icon: L.divIcon({ className:'', html:'<div class="mover">✈️</div>', iconSize:[0,0], iconAnchor:[0,0] }),
    zIndexOffset:1000
  }).addTo(map);

  function animate(ts){
    const t = (ts % LOOP_MS) / LOOP_MS;
    let target = t * totalDist, acc = 0, idx = 0;
    for(; idx < segDist.length; idx++){
      if(acc + segDist[idx] >= target) break;
      acc += segDist[idx];
    }
    idx = Math.min(idx, JOURNEY.length-1);
    const seg = JOURNEY[idx];
    const localT = segDist[idx] ? (target-acc)/segDist[idx] : 0;
    const a = PLACES[seg.from], b = PLACES[seg.to];
    mover.setLatLng([a.lat+(b.lat-a.lat)*localT, a.lng+(b.lng-a.lng)*localT]);
    const emoji = MODE_EMOJI[seg.mode];
    const el = mover.getElement();
    if(el){ const inner = el.querySelector('.mover'); if(inner && inner.textContent !== emoji) inner.textContent = emoji; }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  // ---------- Sidebar ----------
  const stepsList = document.getElementById('stepsList');
  STEPS.forEach(s=>{
    const el = document.createElement('div');
    el.className = 'step';
    el.dataset.ids = JSON.stringify(s.bounds || [s.focus]);
    el.innerHTML = `
      <div class="step-num">${s.n}</div>
      <div class="step-body">
        <span class="step-cat">${s.cat}</span>
        <h3>${s.title}</h3>
        <p>${s.text}</p>
      </div>`;
    el.addEventListener('click', ()=> focusIds(s.bounds || [s.focus], el));
    stepsList.appendChild(el);
  });

  const notice = document.createElement('div');
  notice.className = 'notice';
  notice.innerHTML = `
    <h4>⚠ De reținut</h4>
    <ul>
      <li>Grupuri de până la 10 persoane: excursii de grup în limba engleză, fără preluare de la hotel; deplasarea cu trenul între orașe se face pe cont propriu, fără însoțitor din partea agenției.</li>
      <li>Grupuri de peste 10 persoane: excursii exclusive, cu ghid în limba rusă, și un manager din Chișinău care asistă pe tot parcursul călătoriei.</li>
    </ul>`;
  stepsList.appendChild(notice);

  function focusIds(ids, sourceEl){
    if(ids.length > 1){
      const b = L.latLngBounds(ids.map(id=>[PLACES[id].lat,PLACES[id].lng]));
      map.flyToBounds(b, { padding:[90,90], duration:1.1 });
    } else {
      const p = PLACES[ids[0]];
      map.flyTo([p.lat,p.lng], Math.max(map.getZoom(), p.zoom), { duration:.9 });
    }

    Object.entries(markers).forEach(([mid,m])=>{
      const wrap = m.getElement()?.querySelector('.pill');
      if(!wrap) return;
      const active = ids.includes(mid);
      wrap.classList.toggle('is-active', active);
      if(active){ wrap.classList.remove('pulse'); void wrap.offsetWidth; wrap.classList.add('pulse'); }
    });

    document.querySelectorAll('.step').forEach(el=>{
      const stepIds = JSON.parse(el.dataset.ids);
      el.classList.toggle('active', stepIds.some(id=>ids.includes(id)));
    });
    if(sourceEl) sourceEl.scrollIntoView({behavior:'smooth', block:'nearest'});
  }

  // ---------- Sidebar open/close ----------
  const sidebar = document.getElementById('sidebar');
  const reopenTab = document.getElementById('reopenTab');
  document.getElementById('sbClose').addEventListener('click', ()=>{
    sidebar.classList.add('hidden'); reopenTab.classList.add('show');
  });
  reopenTab.addEventListener('click', ()=>{
    sidebar.classList.remove('hidden'); reopenTab.classList.remove('show');
  });

  document.getElementById('reserveBtn').addEventListener('click', ()=>{
    alert('Conectează acest buton la pagina de rezervare a circuitului.');
  });
</script>
</body>
</html>
