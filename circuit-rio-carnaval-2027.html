<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Carnavalul de la Rio de Janeiro 2027 · din Chișinău</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --magenta:      #C81D6B;
    --magenta-dark: #6E0F3E;
    --magenta-light:#E14C8B;
    --gold:         #E0A63D;
    --teal:         #1B7A78;
    --teal-soft:    #DEEFEE;
    --sand:         #FBF4E8;
    --panel:        #F3E6D3;
    --ink:          #241A2E;
    --ink-soft:     #6B5C73;
    --line:         rgba(36,26,46,0.10);
    --warn-bg:      #F6EAD9;
    --warn-edge:    #B8763D;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;
    font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--sand);}

  #app{position:relative;width:100vw;height:100vh;}
  #map{position:absolute;inset:0;background:#EDE6D8;}
  .leaflet-control-attribution{font-size:10px;opacity:.6;background:rgba(255,255,255,.75)!important;}
  .leaflet-control-zoom{border:none!important;margin:0 16px 18px 0!important;}
  .leaflet-control-zoom a{
    border-radius:10px!important;color:var(--magenta-dark)!important;
    box-shadow:0 2px 10px rgba(36,26,46,.15)!important;border:1px solid var(--line)!important;
  }

  /* ---------- Reserve button ---------- */
  #reserveBtn{
    position:absolute;top:20px;left:20px;z-index:500;
    display:inline-flex;align-items:center;gap:8px;
    background:var(--magenta);color:#fff;border:none;border-radius:999px;
    padding:13px 22px 13px 18px;font:600 14.5px 'Inter',sans-serif;letter-spacing:.2px;
    cursor:pointer;box-shadow:0 6px 18px rgba(110,15,62,.32);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  #reserveBtn:hover{background:var(--magenta-light);transform:translateY(-1px);box-shadow:0 8px 22px rgba(110,15,62,.4);}
  #reserveBtn svg{width:16px;height:16px;flex:none;}

  /* ---------- Map pill markers ---------- */
  .pill{display:inline-flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%);}
  .pill-label{
    background:var(--magenta);color:#fff;font:700 12.5px 'Inter',sans-serif;letter-spacing:.2px;
    padding:6px 12px;border-radius:8px;white-space:nowrap;box-shadow:0 4px 12px rgba(110,15,62,.32);
    border:1.5px solid rgba(255,255,255,.5);
    transition:transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease;
  }
  .pill.waypoint .pill-label{background:var(--teal);font-weight:600;padding:5px 10px;font-size:11.5px;}
  .pill-tail{width:9px;height:9px;background:var(--magenta);transform:rotate(45deg) translateY(-6px);
    box-shadow:0 4px 8px rgba(110,15,62,.22);}
  .pill.waypoint .pill-tail{background:var(--teal);}
  .pill.is-active .pill-label{transform:scale(1.12);box-shadow:0 6px 18px rgba(110,15,62,.48);}
  .pill.pulse .pill-label{animation:pulse .8s ease;}
  @keyframes pulse{0%{transform:scale(1);} 40%{transform:scale(1.28);} 100%{transform:scale(1.12);}}

  .mover{display:flex;align-items:center;justify-content:center;width:30px;height:30px;
    border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(36,26,46,.35);
    border:2px solid var(--teal);font-size:15px;transform:translate(-50%,-50%);}

  /* ---------- Sidebar ---------- */
  #sidebar{
    position:absolute;top:0;right:0;height:100%;width:410px;max-width:88vw;
    background:var(--sand);z-index:600;display:flex;flex-direction:column;
    box-shadow:-8px 0 30px rgba(36,26,46,.16);
    transition:transform .35s cubic-bezier(.65,0,.35,1);
  }
  #sidebar.hidden{transform:translateX(100%);}

  .sb-header{position:relative;padding:26px 26px 22px;background:linear-gradient(155deg,var(--magenta-dark),var(--magenta) 85%);
    color:#fff;overflow:hidden;flex:none;}
  .sb-header .waves{position:absolute;left:0;right:0;bottom:0;height:38px;opacity:.3;}
  .sb-close{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;
    background:rgba(255,255,255,.16);border:none;color:#fff;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .15s ease;}
  .sb-close:hover{background:rgba(255,255,255,.3);}
  .eyebrow{font:700 11px 'Inter',sans-serif;letter-spacing:1.3px;text-transform:uppercase;
    color:#F6C9DD;position:relative;z-index:1;}
  .sb-header h1{font:600 24px/1.25 'Fraunces',serif;margin:8px 0 10px;position:relative;z-index:1;}
  .price-line{font:700 13px 'Inter',sans-serif;color:#FCE4A8;position:relative;z-index:1;margin-bottom:8px;}
  .route-breadcrumb{font:500 12px 'Inter',sans-serif;color:#F7E1EC;line-height:1.6;position:relative;z-index:1;}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;position:relative;z-index:1;}
  .legend span{display:flex;align-items:center;gap:6px;font:500 11.5px 'Inter',sans-serif;color:#FBEFF5;}
  .legend i{width:16px;height:0;display:inline-block;}
  .l-flight i{border-top:2.5px dashed #A9E0DE;}
  .l-tour i{border-top:3px dashed #F5CE85;}

  .steps{flex:1;overflow-y:auto;padding:6px 0 26px;}
  .steps::-webkit-scrollbar{width:6px;}
  .steps::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}

  .step{display:flex;gap:14px;padding:16px 26px;cursor:pointer;border-left:3px solid transparent;
    transition:background .18s ease, border-color .18s ease;}
  .step:hover{background:var(--panel);}
  .step.active{background:var(--teal-soft);border-left-color:var(--magenta);}
  .step-num{flex:none;width:27px;height:27px;border-radius:50%;background:var(--magenta);color:#fff;
    display:flex;align-items:center;justify-content:center;font:700 12.5px 'Inter',sans-serif;margin-top:2px;}
  .step-body h3{margin:0 0 2px;font:600 14.5px 'Fraunces',serif;color:var(--ink);}
  .step-date{display:block;font:600 10.5px 'Inter',sans-serif;letter-spacing:.3px;text-transform:uppercase;
    color:var(--ink-soft);opacity:.8;margin-bottom:6px;}
  .step-body p{margin:0;font:400 13px/1.6 'Inter',sans-serif;color:var(--ink-soft);}
  .tag{display:inline-block;margin-top:8px;font:600 10.5px 'Inter',sans-serif;letter-spacing:.3px;
    text-transform:uppercase;color:var(--magenta-dark);background:rgba(200,29,107,.09);
    padding:3px 9px;border-radius:999px;}

  .notice{margin:6px 26px 0;padding:14px 16px;background:var(--warn-bg);border-left:3px solid var(--warn-edge);
    border-radius:0 10px 10px 0;}
  .notice h4{margin:0 0 8px;font:700 11.5px 'Inter',sans-serif;letter-spacing:.3px;text-transform:uppercase;
    color:#8A5A25;display:flex;align-items:center;gap:6px;}
  .notice ul{margin:0;padding-left:18px;}
  .notice li{font:400 12.5px/1.55 'Inter',sans-serif;color:#5E4530;margin-bottom:6px;}
  .notice li:last-child{margin-bottom:0;}

  #reopenTab{
    position:absolute;top:24px;right:0;z-index:601;background:var(--magenta);color:#fff;border:none;
    padding:12px 14px;border-radius:10px 0 0 10px;font:600 12.5px 'Inter',sans-serif;cursor:pointer;
    box-shadow:-4px 4px 14px rgba(110,15,62,.28);display:none;align-items:center;gap:6px;
  }
  #reopenTab.show{display:flex;}

  @media (max-width:760px){
    #sidebar{top:auto;bottom:0;left:0;right:0;width:100%;max-width:100%;height:60vh;
      border-radius:18px 18px 0 0;transition:transform .35s cubic-bezier(.65,0,.35,1);}
    #sidebar.hidden{transform:translateY(100%);}
    #reopenTab{top:auto;bottom:20px;right:16px;border-radius:999px;box-shadow:0 6px 18px rgba(110,15,62,.32);}
    #reserveBtn{padding:11px 18px 11px 15px;font-size:13.5px;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>

  <button id="reserveBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    Rezervă acum
  </button>

  <aside id="sidebar">
    <div class="sb-header">
      <svg class="waves" viewBox="0 0 400 38" preserveAspectRatio="none"><path d="M0 24 C 40 8, 80 8, 120 24 C 160 40, 200 40, 240 24 C 280 8, 320 8, 360 24 C 380 32, 390 34, 400 30 L400 38 L0 38 Z" fill="#fff"/></svg>
      <button class="sb-close" id="sbClose" aria-label="Închide">✕</button>
      <div class="eyebrow">08–18 Februarie 2027 · 11 zile / 8 nopți</div>
      <h1>Carnavalul de la Rio de Janeiro 2027 🎭🇧🇷</h1>
      <div class="price-line">De la 2.799 € / persoană</div>
      <div class="route-breadcrumb">Chișinău → Rio de Janeiro → Copacabana → Ipanema → Parcul Tijuca → Rio de Janeiro → Chișinău</div>
      <div class="legend">
        <span class="l-flight"><i></i>Zbor (via Frankfurt)</span>
        <span class="l-tour"><i></i>Excursie / transfer</span>
      </div>
    </div>

    <div class="steps" id="stepsList"></div>
  </aside>

  <button id="reopenTab">☰ Itinerariu</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // ---------- Data ----------
  const PLACES = {
    chi:  { name:'Chișinău',        lat:47.0105,  lng:28.8638,  waypoint:true,  zoom:5  },
    fra:  { name:'Frankfurt',       lat:50.1109,  lng:8.6821,   waypoint:true,  zoom:5  },
    rio:  { name:'Rio de Janeiro',  lat:-22.9111, lng:-43.1963, waypoint:false, zoom:12 },
    cop:  { name:'Copacabana',      lat:-22.9711, lng:-43.1822, waypoint:false, zoom:13 },
    ipa:  { name:'Ipanema',         lat:-22.9838, lng:-43.2096, waypoint:false, zoom:13 },
    tij:  { name:'Parcul Tijuca',   lat:-22.9642, lng:-43.2823, waypoint:false, zoom:12 },
  };

  // Long-haul flight legs (animated, looping out-and-back)
  const FLIGHT_LEGS = [
    { from:'chi', to:'fra' }, { from:'fra', to:'rio' },
    { from:'rio', to:'fra' }, { from:'fra', to:'chi' },
  ];
  // Local excursions radiating from the Copacabana hotel base (static)
  const TOUR_LEGS = [
    { from:'cop', to:'rio' }, { from:'cop', to:'ipa' }, { from:'cop', to:'tij' },
  ];

  const STEPS = [
    { n:1, date:'Luni, 08 Februarie', title:'Chișinău – Frankfurt – Rio de Janeiro', bounds:['chi','fra','rio'],
      tag:'Zbor transatlantic',
      text:'Sosire la Aeroportul Chișinău la 10:00. Zbor Lufthansa LH1479, ora 13:00, spre Frankfurt (sosire 15:30), urmat de o escală de ~7h45m. La 23:15, zbor transatlantic LH500 spre Rio de Janeiro — noapte la bord.' },
    { n:2, date:'Marți, 09 Februarie', title:'Sosire – Copacabana – prima seară de Carnaval', focus:'cop',
      tag:'Cazare: Royal Rio Palace Hotel 4★',
      text:'Aterizare pe Aeroportul Galeão la 06:10 și transfer privat spre Royal Rio Palace Hotel 4★, în Copacabana. Bagajele pot fi depozitate până la check-in-ul standard (14:00). Seara, deplasare spre Sambadrom — porțile se deschid ~18:30 — pentru prima noapte de spectacol, ce poate continua până spre dimineață.' },
    { n:3, date:'Miercuri, 10 Februarie', title:'Copacabana – Ipanema – zi liberă', focus:'ipa',
      tag:'Opțional: Rocinha +35 €',
      text:'Dimineață de odihnă după noaptea de Carnaval — plajă la Copacabana sau piscina hotelului. După-amiază, recomandăm Ipanema și Arpoador: plimbare pe faleză, cafenele și apus. Opțional: tur pietonal cu ghid local în Rocinha (2-3 ore, +35 €/persoană).' },
    { n:4, date:'Joi, 11 Februarie', title:'Marele Tur al orașului Rio de Janeiro', focus:'rio',
      tag:'Excursie inclusă',
      text:'Preluare de la hotel 07:30–08:00 pentru un tur ghidat de 8-9 ore: Cristo Redentor și Corcovado, telecabină spre Pão de Açúcar cu vedere asupra Golfului Guanabara, Scările Selarón, Catedrala Metropolitană și opriri foto la Maracanã și Sambadrom. Prânz BBQ all-you-can-eat inclus, la o churrascaria tradițională.' },
    { n:5, date:'Vineri, 12 Februarie', title:'Zi liberă', focus:'ipa',
      tag:'Opțional: velier +49 €',
      text:'Program relaxat de odihnă — Copacabana dimineața, apoi timp liber în Ipanema sau Leblon. Opțional: tur cu velierul la apus, din Marina da Glória, prin Golful Guanabara, cu băuturi și gustări incluse (~3 ore, +49 €/persoană).' },
    { n:6, date:'Sâmbătă, 13 Februarie', title:'Parada Campionilor', focus:'rio',
      tag:'Sambadrom',
      text:'Prima parte a zilei rămâne liberă — plajă, piscină sau un prânz relaxat. Seara, revenim la Sambadrom pentru Desfile das Campeãs, parada de celebrare a primelor șase școli de samba clasate în Grupul Special. Deplasarea Copacabana–Sambadrom se face individual, cu transport local.' },
    { n:7, date:'Duminică, 14 Februarie', title:'Zi liberă', focus:'ipa',
      tag:'Opțional: parapantă +90 €',
      text:'Zi întreagă în ritm propriu — Ipanema, Leblon, Arpoador sau cartierul boem Santa Teresa. Opțional: zbor tandem cu parapanta deasupra orașului (2-3 ore, +90 €/persoană, în funcție de vreme și confirmarea operatorului).' },
    { n:8, date:'Luni, 15 Februarie', title:'Pădurea Tropicală Tijuca', focus:'tij',
      tag:'Excursie inclusă',
      text:'Preluare de la hotel 07:00–07:30 pentru ~5 ore de explorare ghidată în Parcul Național Tijuca: trasee prin vegetație tropicală, Cascada Taunay și zona peșterilor, cu posibile opriri la cascade și la Vista Chinesa.' },
    { n:9, date:'Marți, 16 Februarie', title:'Ultima zi completă în Rio', focus:'ipa',
      tag:'Opțional: Lapa +30 € (18+)',
      text:'Zi liberă pentru revenirea la locurile preferate — Jardim Botânico, Lagoa Rodrigo de Freitas, Ipanema sau Leblon, cu apus la Arpoador. Opțional, seara: tur al pub-urilor din Lapa, cu degustare de cachaça și samba live (~4 ore, +30 €/persoană, doar 18+).' },
    { n:10, date:'Miercuri, 17 Februarie', title:'Rio de Janeiro – Frankfurt', bounds:['rio','fra'],
      tag:'Zbor retur',
      text:'Eliberarea camerelor la 10:45, transfer privat spre Aeroportul Galeão la 11:00. Decolare cu zborul Lufthansa LH501, ora 15:40, spre Frankfurt — noapte la bord.' },
    { n:11, date:'Joi, 18 Februarie', title:'Frankfurt – Chișinău', bounds:['fra','chi'],
      tag:'Sosire Chișinău',
      text:'Aterizare la Frankfurt 06:55, escală de ~2h05m, apoi zborul LH1478 la 09:00 spre Chișinău. Aterizare la 12:20 — sfârșitul programului.' },
  ];

  // ---------- Map ----------
  const map = L.map('map', { zoomControl:false, attributionControl:true, worldCopyJump:true });
  L.control.zoom({ position:'bottomright' }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution:'© OpenStreetMap, © CARTO', maxZoom:19, subdomains:'abcd'
  }).addTo(map);

  const rioBounds = L.latLngBounds(['rio','cop','ipa','tij'].map(id=>[PLACES[id].lat,PLACES[id].lng]));
  map.fitBounds(rioBounds, { padding:[100,100] });

  function pillIcon(name, waypoint){
    return L.divIcon({
      className:'', html:`<div class="pill${waypoint?' waypoint':''}"><div class="pill-label">${name}</div><div class="pill-tail"></div></div>`,
      iconSize:[0,0], iconAnchor:[0,0]
    });
  }

  const markers = {};
  Object.entries(PLACES).forEach(([id,p])=>{
    const m = L.marker([p.lat,p.lng], { icon:pillIcon(p.name,p.waypoint) }).addTo(map);
    markers[id] = m;
    m.on('click', ()=> focusIds([id]));
  });

  FLIGHT_LEGS.slice(0,2).forEach(seg=>{ // draw each unique flight leg once (out + back overlap visually, fine)
    const a = PLACES[seg.from], b = PLACES[seg.to];
    L.polyline([[a.lat,a.lng],[b.lat,b.lng]], { color:'#1B7A78', weight:3, opacity:.8, dashArray:'1 11', lineCap:'round' }).addTo(map);
  });
  TOUR_LEGS.forEach(seg=>{
    const a = PLACES[seg.from], b = PLACES[seg.to];
    L.polyline([[a.lat,a.lng],[b.lat,b.lng]], { color:'#E0A63D', weight:3.5, opacity:.85, dashArray:'1 9', lineCap:'round' }).addTo(map);
  });

  // ---------- Moving plane along the flight legs only ----------
  function haversine(a,b){
    const R=6371, toRad=d=>d*Math.PI/180;
    const dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
    const s=Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(s));
  }
  const segDist = FLIGHT_LEGS.map(s=>haversine(PLACES[s.from],PLACES[s.to]));
  const totalDist = segDist.reduce((a,b)=>a+b,0);
  const LOOP_MS = 34000;

  const mover = L.marker([PLACES.chi.lat,PLACES.chi.lng], {
    icon: L.divIcon({ className:'', html:'<div class="mover">✈️</div>', iconSize:[0,0], iconAnchor:[0,0] }),
    zIndexOffset:1000
  }).addTo(map);

  function animate(ts){
    const t = (ts % LOOP_MS) / LOOP_MS;
    let target = t * totalDist, acc = 0, idx = 0;
    for(; idx < segDist.length; idx++){
      if(acc + segDist[idx] >= target) break;
      acc += segDist[idx];
    }
    idx = Math.min(idx, FLIGHT_LEGS.length-1);
    const seg = FLIGHT_LEGS[idx];
    const localT = segDist[idx] ? (target-acc)/segDist[idx] : 0;
    const a = PLACES[seg.from], b = PLACES[seg.to];
    mover.setLatLng([a.lat+(b.lat-a.lat)*localT, a.lng+(b.lng-a.lng)*localT]);
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  // ---------- Sidebar ----------
  const stepsList = document.getElementById('stepsList');
  STEPS.forEach(s=>{
    const el = document.createElement('div');
    el.className = 'step';
    el.dataset.ids = JSON.stringify(s.bounds || [s.focus]);
    el.innerHTML = `
      <div class="step-num">${s.n}</div>
      <div class="step-body">
        <span class="step-date">${s.date}</span>
        <h3>${s.title}</h3>
        <p>${s.text}</p>
        <span class="tag">${s.tag}</span>
      </div>`;
    el.addEventListener('click', ()=> focusIds(s.bounds || [s.focus], el));
    stepsList.appendChild(el);
  });

  const notice = document.createElement('div');
  notice.className = 'notice';
  notice.innerHTML = `
    <h4>⚠ De reținut</h4>
    <ul>
      <li>Locurile și biletele la Sambadrom sunt în funcție de disponibilitate la momentul confirmării.</li>
      <li>Programul poate suferi modificări în funcție de orarul zborurilor, condițiile locale și programul oficial al Carnavalului.</li>
    </ul>`;
  stepsList.appendChild(notice);

  function focusIds(ids, sourceEl){
    if(ids.length > 1){
      const b = L.latLngBounds(ids.map(id=>[PLACES[id].lat,PLACES[id].lng]));
      map.flyToBounds(b, { padding:[90,90], duration:1.1 });
    } else {
      const p = PLACES[ids[0]];
      map.flyTo([p.lat,p.lng], Math.max(map.getZoom(), p.zoom), { duration:.9 });
    }

    Object.entries(markers).forEach(([mid,m])=>{
      const wrap = m.getElement()?.querySelector('.pill');
      if(!wrap) return;
      const active = ids.includes(mid);
      wrap.classList.toggle('is-active', active);
      if(active){ wrap.classList.remove('pulse'); void wrap.offsetWidth; wrap.classList.add('pulse'); }
    });

    document.querySelectorAll('.step').forEach(el=>{
      const stepIds = JSON.parse(el.dataset.ids);
      el.classList.toggle('active', stepIds.some(id=>ids.includes(id)));
    });
    if(sourceEl) sourceEl.scrollIntoView({behavior:'smooth', block:'nearest'});
  }

  // ---------- Sidebar open/close ----------
  const sidebar = document.getElementById('sidebar');
  const reopenTab = document.getElementById('reopenTab');
  document.getElementById('sbClose').addEventListener('click', ()=>{
    sidebar.classList.add('hidden'); reopenTab.classList.add('show');
  });
  reopenTab.addEventListener('click', ()=>{
    sidebar.classList.remove('hidden'); reopenTab.classList.remove('show');
  });

  document.getElementById('reserveBtn').addEventListener('click', ()=>{
    alert('Conectează acest buton la pagina de rezervare a circuitului.');
  });
</script>
</body>
</html>
