<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Basmul de Crăciun la Budapesta</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --wine:       #6B1F3A;
    --wine-dark:  #3D0F20;
    --wine-light: #8C3055;
    --gold:       #D4AF37;
    --ice:        #3E6FA6;
    --snow:       #F7F5F0;
    --panel:      #ECE4DA;
    --ink:        #241A1F;
    --ink-soft:   #5C4F55;
    --line:       rgba(36,26,31,0.10);
    --warn-bg:    #F1E9DA;
    --warn-edge:  #B8863B;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;
    font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--snow);}

  #app{position:relative;width:100vw;height:100vh;}
  #map{position:absolute;inset:0;background:#E6E4DA;}
  .leaflet-control-attribution{font-size:10px;opacity:.6;background:rgba(255,255,255,.75)!important;}
  .leaflet-control-zoom{border:none!important;margin:0 16px 18px 0!important;}
  .leaflet-control-zoom a{
    border-radius:10px!important;color:var(--wine-dark)!important;
    box-shadow:0 2px 10px rgba(61,15,32,.15)!important;border:1px solid var(--line)!important;
  }

  /* ---------- Reserve button ---------- */
  #reserveBtn{
    position:absolute;top:20px;left:20px;z-index:500;
    display:inline-flex;align-items:center;gap:8px;
    background:var(--wine);color:#fff;border:none;border-radius:999px;
    padding:13px 22px 13px 18px;font:600 14.5px 'Inter',sans-serif;letter-spacing:.2px;
    cursor:pointer;box-shadow:0 6px 18px rgba(61,15,32,.32);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  #reserveBtn:hover{background:var(--wine-light);transform:translateY(-1px);box-shadow:0 8px 22px rgba(61,15,32,.4);}
  #reserveBtn svg{width:16px;height:16px;flex:none;}

  /* ---------- Map pill markers ---------- */
  .pill{display:inline-flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%);}
  .pill-label{
    background:var(--wine);color:#fff;font:700 12.5px 'Inter',sans-serif;letter-spacing:.2px;
    padding:6px 12px;border-radius:8px;white-space:nowrap;box-shadow:0 4px 12px rgba(61,15,32,.32);
    border:1.5px solid rgba(255,255,255,.5);
    transition:transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease;
  }
  .pill.waypoint .pill-label{background:var(--gold);color:#3D2E05;font-weight:700;padding:5px 10px;font-size:11.5px;}
  .pill-tail{width:9px;height:9px;background:var(--wine);transform:rotate(45deg) translateY(-6px);
    box-shadow:0 4px 8px rgba(61,15,32,.22);}
  .pill.waypoint .pill-tail{background:var(--gold);}
  .pill.is-active .pill-label{transform:scale(1.12);box-shadow:0 6px 18px rgba(61,15,32,.48);}
  .pill.pulse .pill-label{animation:pulse .8s ease;}
  @keyframes pulse{0%{transform:scale(1);} 40%{transform:scale(1.28);} 100%{transform:scale(1.12);}}

  .mover{display:flex;align-items:center;justify-content:center;width:30px;height:30px;
    border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(36,26,31,.35);
    border:2px solid var(--ice);font-size:15px;transform:translate(-50%,-50%);}

  /* ---------- Sidebar ---------- */
  #sidebar{
    position:absolute;top:0;right:0;height:100%;width:410px;max-width:88vw;
    background:var(--snow);z-index:600;display:flex;flex-direction:column;
    box-shadow:-8px 0 30px rgba(36,26,31,.16);
    transition:transform .35s cubic-bezier(.65,0,.35,1);
  }
  #sidebar.hidden{transform:translateX(100%);}

  .sb-header{position:relative;padding:26px 26px 22px;background:linear-gradient(155deg,var(--wine-dark),var(--wine) 85%);
    color:#fff;overflow:hidden;flex:none;}
  .sb-header .parliament{position:absolute;left:0;right:0;bottom:0;height:44px;opacity:.26;}
  .sb-close{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;
    background:rgba(255,255,255,.16);border:none;color:#fff;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .15s ease;}
  .sb-close:hover{background:rgba(255,255,255,.3);}
  .eyebrow{font:700 11px 'Inter',sans-serif;letter-spacing:1.3px;text-transform:uppercase;
    color:#E9C7D3;position:relative;z-index:1;}
  .sb-header h1{font:600 23px/1.28 'Fraunces',serif;margin:8px 0 10px;position:relative;z-index:1;}
  .route-breadcrumb{font:500 12px 'Inter',sans-serif;color:#F3E4EA;line-height:1.6;position:relative;z-index:1;}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;position:relative;z-index:1;}
  .legend span{display:flex;align-items:center;gap:6px;font:500 11.5px 'Inter',sans-serif;color:#F6EEF1;}
  .legend i{width:16px;height:0;display:inline-block;}
  .l-flight i{border-top:2.5px dashed #A9CBE4;}
  .l-tour i{border-top:3px dashed #F0D989;}

  .steps{flex:1;overflow-y:auto;padding:6px 0 26px;}
  .steps::-webkit-scrollbar{width:6px;}
  .steps::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}

  .step{display:flex;gap:14px;padding:16px 26px;cursor:pointer;border-left:3px solid transparent;
    transition:background .18s ease, border-color .18s ease;}
  .step:hover{background:var(--panel);}
  .step.active{background:#EDE1E7;border-left-color:var(--wine);}
  .step-num{flex:none;width:27px;height:27px;border-radius:50%;background:var(--wine);color:#fff;
    display:flex;align-items:center;justify-content:center;font:700 12.5px 'Inter',sans-serif;margin-top:2px;}
  .step-body h3{margin:0 0 2px;font:600 14.5px 'Fraunces',serif;color:var(--ink);}
  .step-date{display:block;font:600 10.5px 'Inter',sans-serif;letter-spacing:.3px;text-transform:uppercase;
    color:var(--ink-soft);opacity:.8;margin-bottom:6px;}
  .step-body p{margin:0;font:400 13px/1.6 'Inter',sans-serif;color:var(--ink-soft);}
  .tag{display:inline-block;margin-top:8px;font:600 10.5px 'Inter',sans-serif;letter-spacing:.3px;
    text-transform:uppercase;color:var(--wine-dark);background:rgba(107,31,58,.09);
    padding:3px 9px;border-radius:999px;}

  .notice{margin:6px 26px 0;padding:14px 16px;background:var(--warn-bg);border-left:3px solid var(--warn-edge);
    border-radius:0 10px 10px 0;}
  .notice h4{margin:0 0 8px;font:700 11.5px 'Inter',sans-serif;letter-spacing:.3px;text-transform:uppercase;
    color:#8A5A25;display:flex;align-items:center;gap:6px;}
  .notice ul{margin:0;padding-left:18px;}
  .notice li{font:400 12.5px/1.55 'Inter',sans-serif;color:#5E4530;margin-bottom:6px;}
  .notice li:last-child{margin-bottom:0;}

  #reopenTab{
    position:absolute;top:24px;right:0;z-index:601;background:var(--wine);color:#fff;border:none;
    padding:12px 14px;border-radius:10px 0 0 10px;font:600 12.5px 'Inter',sans-serif;cursor:pointer;
    box-shadow:-4px 4px 14px rgba(61,15,32,.28);display:none;align-items:center;gap:6px;
  }
  #reopenTab.show{display:flex;}

  @media (max-width:760px){
    #sidebar{top:auto;bottom:0;left:0;right:0;width:100%;max-width:100%;height:60vh;
      border-radius:18px 18px 0 0;transition:transform .35s cubic-bezier(.65,0,.35,1);}
    #sidebar.hidden{transform:translateY(100%);}
    #reopenTab{top:auto;bottom:20px;right:16px;border-radius:999px;box-shadow:0 6px 18px rgba(61,15,32,.32);}
    #reserveBtn{padding:11px 18px 11px 15px;font-size:13.5px;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>


  <aside id="sidebar">
    <div class="sb-header">
      <svg class="parliament" viewBox="0 0 400 44" preserveAspectRatio="none">
        <path d="M60 44 L60 26 L70 26 L70 18 L78 18 L78 26 L100 26 L100 10 L108 10 L108 4 L116 4 L116 10 L124 10 L124 26 L146 26 L146 18 L154 18 L154 26 L164 26 L164 44 Z" fill="#fff"/>
        <path d="M230 44 L230 22 L240 22 L240 30 L248 30 L248 14 L256 14 L256 30 L264 30 L264 22 L274 22 L274 44 Z" fill="#fff" opacity=".7"/>
      </svg>
      <button class="sb-close" id="sbClose" aria-label="Închide">✕</button>
      <div class="eyebrow">08–12 Decembrie 2026 · 5 zile / 4 nopți</div>
      <h1>Basmul de Crăciun la Budapesta 🇭🇺🎄</h1>
      <div class="route-breadcrumb">Chișinău → Budapesta → Viena &amp; Bratislava (opțional) → Budapesta → Chișinău</div>
      <div class="legend">
        <span class="l-flight"><i></i>Zbor</span>
        <span class="l-tour"><i></i>Excursie opțională</span>
      </div>
    </div>

    <div class="steps" id="stepsList"></div>
  </aside>

  <button id="reopenTab">☰ Program</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // ---------- Data ----------
  const PLACES = {
    chi:  { name:'Chișinău',   lat:47.0105, lng:28.8638, waypoint:false, zoom:7  },
    bud:  { name:'Budapesta',  lat:47.4979, lng:19.0402, waypoint:false, zoom:11 },
    vie:  { name:'Viena',      lat:48.2082, lng:16.3738, waypoint:true,  zoom:11 },
    bra:  { name:'Bratislava', lat:48.1486, lng:17.1077, waypoint:true,  zoom:11 },
  };

  const FLIGHT_LEGS = [ { from:'chi', to:'bud' }, { from:'bud', to:'chi' } ];
  const TOUR_LEGS = [
    { from:'bud', to:'vie' }, { from:'vie', to:'bra' }, { from:'bra', to:'bud' },
  ];

  const STEPS = [
    { n:1, date:'Marți, 08 Decembrie', title:'Chișinău – Budapesta | Sosire', bounds:['chi','bud'],
      tag:'Cazare: Smart Hotel Budapest 4★',
      text:'Prezentare la Aeroportul Chișinău la 11:25, decolare 14:25 — zbor direct de 1h35m. Aterizare în Budapesta la 15:00, transfer privat inclus până la hotel. Seara, Târgul de Crăciun de la Bazilica Sf. Ștefan — votat cel mai frumos din Europa —, cu proiecții 3D pe fațadă și un Kürtőskalács cald.' },
    { n:2, date:'Miercuri, 09 Decembrie', title:'Splendoarea Pestei &amp; Croazieră pe Dunăre', focus:'bud',
      tag:'Cazare: Smart Hotel Budapest 4★',
      text:'Zi liberă pentru bulevardul Andrássy, Piața Eroilor și strada pietonală Váci utca. Seara, croazieră nocturnă inclusă pe Dunăre (18:30–19:20): băutură de bun venit, ghid audio și priveliștea Parlamentului și a Castelului Buda luminate în apă.' },
    { n:3, date:'Joi, 10 Decembrie', title:'Secretele din Buda &amp; Băile Termale', focus:'bud',
      tag:'Cazare: Smart Hotel Budapest 4★',
      text:'Cartierul istoric Buda — Bastionul Pescarilor și Biserica Matthias, pentru cele mai frumoase imagini de iarnă. Recomandare de după-amiază: Băile Termale Széchenyi.' },
    { n:4, date:'Vineri, 11 Decembrie', title:'Zi liberă sau excursie opțională Viena &amp; Bratislava', bounds:['bud','vie','bra'],
      tag:'Excursie opțională (cost separat)',
      text:'Opțional, cu autocarul: plecare 07:30 spre Viena — tur ghidat la Palatul Belvedere, timp liber în centrul istoric și Târgul de Crăciun de la Rathausplatz. Continuare spre Bratislava — tur ghidat la Castel și timp liber în Centrul Vechi. Retur la hotel în Budapesta, seara. Alternativ: zi liberă extinsă în Budapesta.' },
    { n:5, date:'Sâmbătă, 12 Decembrie', title:'Ultimele suveniruri &amp; retur', bounds:['bud','chi'],
      tag:'Zbor retur',
      text:'Mic dejun și check-out, cu depozitare de bagaje la hotel. Timp pentru cumpărături — boia de ardei, vin de Tokaj, porțelanuri. Transfer privat spre aeroport la 12:00, decolare 15:35, sosire în Chișinău la 18:05.' },
  ];

  // ---------- Map ----------
  const map = L.map('map', { zoomControl:false, attributionControl:true, worldCopyJump:true });
  L.control.zoom({ position:'bottomright' }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution:'© OpenStreetMap, © CARTO', maxZoom:19, subdomains:'abcd'
  }).addTo(map);

  const allBounds = L.latLngBounds(Object.values(PLACES).map(p=>[p.lat,p.lng]));
  map.fitBounds(allBounds, { padding:[90,90] });

  function pillIcon(name, waypoint){
    return L.divIcon({
      className:'', html:`<div class="pill${waypoint?' waypoint':''}"><div class="pill-label">${name}</div><div class="pill-tail"></div></div>`,
      iconSize:[0,0], iconAnchor:[0,0]
    });
  }

  const markers = {};
  Object.entries(PLACES).forEach(([id,p])=>{
    const m = L.marker([p.lat,p.lng], { icon:pillIcon(p.name,p.waypoint) }).addTo(map);
    markers[id] = m;
    m.on('click', ()=> focusIds([id]));
  });

  FLIGHT_LEGS.slice(0,1).forEach(seg=>{
    const a = PLACES[seg.from], b = PLACES[seg.to];
    L.polyline([[a.lat,a.lng],[b.lat,b.lng]], { color:'#3E6FA6', weight:3, opacity:.8, dashArray:'1 11', lineCap:'round' }).addTo(map);
  });
  TOUR_LEGS.forEach(seg=>{
    const a = PLACES[seg.from], b = PLACES[seg.to];
    L.polyline([[a.lat,a.lng],[b.lat,b.lng]], { color:'#D4AF37', weight:3, opacity:.85, dashArray:'2 8', lineCap:'round' }).addTo(map);
  });

  // ---------- Moving plane along the flight legs only ----------
  function haversine(a,b){
    const R=6371, toRad=d=>d*Math.PI/180;
    const dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
    const s=Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(s));
  }
  const segDist = FLIGHT_LEGS.map(s=>haversine(PLACES[s.from],PLACES[s.to]));
  const totalDist = segDist.reduce((a,b)=>a+b,0);
  const LOOP_MS = 22000;

  const mover = L.marker([PLACES.chi.lat,PLACES.chi.lng], {
    icon: L.divIcon({ className:'', html:'<div class="mover">✈️</div>', iconSize:[0,0], iconAnchor:[0,0] }),
    zIndexOffset:1000
  }).addTo(map);

  function animate(ts){
    const t = (ts % LOOP_MS) / LOOP_MS;
    let target = t * totalDist, acc = 0, idx = 0;
    for(; idx < segDist.length; idx++){
      if(acc + segDist[idx] >= target) break;
      acc += segDist[idx];
    }
    idx = Math.min(idx, FLIGHT_LEGS.length-1);
    const seg = FLIGHT_LEGS[idx];
    const localT = segDist[idx] ? (target-acc)/segDist[idx] : 0;
    const a = PLACES[seg.from], b = PLACES[seg.to];
    mover.setLatLng([a.lat+(b.lat-a.lat)*localT, a.lng+(b.lng-a.lng)*localT]);
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  // ---------- Sidebar ----------
  const stepsList = document.getElementById('stepsList');
  STEPS.forEach(s=>{
    const el = document.createElement('div');
    el.className = 'step';
    el.dataset.ids = JSON.stringify(s.bounds || [s.focus]);
    el.innerHTML = `
      <div class="step-num">${s.n}</div>
      <div class="step-body">
        <span class="step-date">${s.date}</span>
        <h3>${s.title}</h3>
        <p>${s.text}</p>
        <span class="tag">${s.tag}</span>
      </div>`;
    el.addEventListener('click', ()=> focusIds(s.bounds || [s.focus], el));
    stepsList.appendChild(el);
  });

  const notice = document.createElement('div');
  notice.className = 'notice';
  notice.innerHTML = `
    <h4>⚠ De reținut</h4>
    <ul>
      <li>Bagaje: 90 € doar geantă gratuită sub scaun; 160 € total, cu adăugarea unui troller de 10 kg la bord.</li>
      <li>Prezentarea la aeroport este obligatorie cu 3 ore înainte de zbor; la croazieră și la excursia Viena–Bratislava, sosirea se face cu 15–20 minute înainte — transportul nu așteaptă.</li>
      <li>Locurile la acest circuit sunt limitate.</li>
    </ul>`;
  stepsList.appendChild(notice);

  function focusIds(ids, sourceEl){
    if(ids.length > 1){
      const b = L.latLngBounds(ids.map(id=>[PLACES[id].lat,PLACES[id].lng]));
      map.flyToBounds(b, { padding:[90,90], duration:1.1 });
    } else {
      const p = PLACES[ids[0]];
      map.flyTo([p.lat,p.lng], Math.max(map.getZoom(), p.zoom), { duration:.9 });
    }

    Object.entries(markers).forEach(([mid,m])=>{
      const wrap = m.getElement()?.querySelector('.pill');
      if(!wrap) return;
      const active = ids.includes(mid);
      wrap.classList.toggle('is-active', active);
      if(active){ wrap.classList.remove('pulse'); void wrap.offsetWidth; wrap.classList.add('pulse'); }
    });

    document.querySelectorAll('.step').forEach(el=>{
      const stepIds = JSON.parse(el.dataset.ids);
      el.classList.toggle('active', stepIds.some(id=>ids.includes(id)));
    });
    if(sourceEl) sourceEl.scrollIntoView({behavior:'smooth', block:'nearest'});
  }

  // ---------- Sidebar open/close ----------
  const sidebar = document.getElementById('sidebar');
  const reopenTab = document.getElementById('reopenTab');
  document.getElementById('sbClose').addEventListener('click', ()=>{
    sidebar.classList.add('hidden'); reopenTab.classList.add('show');
  });
  reopenTab.addEventListener('click', ()=>{
    sidebar.classList.remove('hidden'); reopenTab.classList.remove('show');
  });

  document.getElementById('reserveBtn').addEventListener('click', ()=>{
    alert('Conectează acest buton la pagina de rezervare a circuitului.');
  });
</script>
</body>
</html>
